{% load static %}
<header class="site-header">
  <div class="site-header__bar container">
    <a href="{% url 'home' %}" class="brand">
      <span class="brand__emoji">🌍</span> LingoGo
    </a>

    <details class="nav-toggle">
      <summary class="nav-toggle__button" aria-label="Menüyü aç">
        <span></span><span></span><span></span>
      </summary>
      {# accounts app henuz 1E'de kurulacak; login/signup/logout/progress su an sabit path #}
      <nav class="site-nav" aria-label="Ana menü">
        <a href="{% url 'home' %}">Ana Sayfa</a>
        <a href="{% url 'lessons:topic_list' %}">Konular</a>
        {% if user.is_authenticated %}
          <a href="/progress/">İlerlemem</a>
          <form action="/accounts/logout/" method="post" class="nav-logout">
            {% csrf_token %}
            <button type="submit">Çıkış Yap</button>
          </form>
        {% else %}
          <a href="/accounts/login/">Giriş Yap</a>
          <a href="/accounts/signup/" class="nav-cta">Kayıt Ol</a>
        {% endif %}
      </nav>
    </details>
  </div>
</header>
