{% load static %}
<header class="site-header">
  <div class="site-header__bar container">
    <a href="{% url 'home' %}" class="brand">
      <span class="brand__emoji">🌍</span> LingoGo
    </a>

    {# Masaüstü nav'ı details'ten ayrı: details kapalıyken tarayıcı içeriğini CSS ile geri açılamayacak şekilde gizliyor. #}
    <nav class="site-nav site-nav--desktop" aria-label="Ana menü">
      {% include 'partials/nav_links.html' %}
    </nav>

    <details class="nav-toggle">
      <summary class="nav-toggle__button" aria-label="Menüyü aç">
        <span></span><span></span><span></span>
      </summary>
      <nav class="site-nav site-nav--mobile" aria-label="Mobil menü">
        {% include 'partials/nav_links.html' %}
      </nav>
    </details>
  </div>
</header>
