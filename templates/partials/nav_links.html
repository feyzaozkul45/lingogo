<div class="site-nav__links">
  <a href="{% url 'lessons:topic_list' %}"{% if request.resolver_match.url_name == 'topic_list' %} class="is-active"{% endif %}>Konular</a>
  <a href="{% url 'lessons:reading_list' %}"{% if request.resolver_match.url_name == 'reading_list' or request.resolver_match.url_name == 'reading_detail' %} class="is-active"{% endif %}>Okuma</a>
  {% if user.is_authenticated %}
    <a href="{% url 'accounts:progress' %}"{% if request.resolver_match.url_name == 'progress' %} class="is-active"{% endif %}>İlerlemem</a>
  {% endif %}
</div>
<div class="site-nav__auth">
  {% if user.is_authenticated %}
    <a href="{% url 'accounts:progress' %}" class="user-avatar" title="{{ user.username }}">{{ user.username|first|upper }}</a>
    <form action="{% url 'accounts:logout' %}" method="post" class="nav-logout">
      {% csrf_token %}
      <button type="submit">Çıkış Yap</button>
    </form>
  {% else %}
    <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm">Giriş Yap</a>
    <a href="{% url 'accounts:signup' %}" class="btn btn-primary btn-sm">Kayıt Ol</a>
  {% endif %}
</div>
